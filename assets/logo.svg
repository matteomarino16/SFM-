<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" role="img" aria-labelledby="t">
  <title id="t">S.F.M. Distribuzione</title>
  <!-- Logo orizzontale bianco: monogramma con calice + logotipo.
       Sostituibile con la versione vettoriale ufficiale. -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cerchio sottile aperto, come nel marchio -->
    <path d="M14 10.5A27 27 0 0 1 56.5 18" stroke-width="1"/>
    <path d="M58.8 30A27 27 0 0 1 7 44" stroke-width="1"/>
    <!-- Calice -->
    <path d="M22 15h16" stroke-width="1.2"/>
    <path d="M22 15c0 12 3.6 18 8 18s8-6 8-18" stroke-width="1.4"/>
    <path d="M30 33v11" stroke-width="1.4"/>
    <path d="M23 45h14" stroke-width="1.2"/>
  </g>
  <!-- Vino nel calice -->
  <path d="M23.2 23.5c1.4 6 3.9 8.6 6.8 8.6s5.4-2.6 6.8-8.6c-2.4 1.4-4.8 1.6-6.8.9-2-.8-4.4-1.4-6.8-.9z" fill="#fff"/>
  <!-- Logotipo -->
  <text x="76" y="35" fill="#fff" font-family="'Cormorant Garamond','Didot','Bodoni 72','Playfair Display',Georgia,serif" font-size="30" font-weight="400" letter-spacing="5">S.F.M.</text>
  <line x1="77" y1="43" x2="268" y2="43" stroke="#fff" stroke-width=".6" opacity=".5"/>
  <text x="77" y="56" fill="#fff" font-family="'Manrope','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="500" letter-spacing="6.2">DISTRIBUZIONE</text>
</svg>
